  <script>
    (function () {
      var s;
      try { s = localStorage.getItem('farm-season'); } catch (e) {}
      if (!/^(spring|summer|fall|winter)$/.test(s || '')) {
        var m = new Date().getMonth();
        s = m < 2 || m === 11 ? 'winter' : m < 5 ? 'spring' : m < 8 ? 'summer' : 'fall';
      }
      document.documentElement.setAttribute('data-season', s);
    })();
  </script>
